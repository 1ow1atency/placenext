<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead('Register')}"></head>
<body>
<div class="auth-page">
    <div class="auth-wrap">
        <div class="auth-brand">
            <h1>PLACENEXT</h1>
            <p>Campus placement &amp; internship portal</p>
        </div>

        <div class="window">
            <div class="window-bar">
                <span>AUTH_MANAGER.EXE</span>
                <span class="window-controls"><span></span><span></span></span>
            </div>
            <div class="window-body">
                <div class="tabs">
                    <a class="tab" th:href="@{/login}">LOG IN</a>
                    <a class="tab active" th:href="@{/register}">REGISTER</a>
                </div>

                <form th:action="@{/register}" th:object="${form}" method="post">
                    <div class="field">
                        <label for="fullName">Full name</label>
                        <input class="input" type="text" th:field="*{fullName}" placeholder="Your name">
                        <span class="field-error" th:errors="*{fullName}"></span>
                    </div>
                    <div class="field">
                        <label for="email">College email</label>
                        <input class="input" type="email" th:field="*{email}" placeholder="you@college.edu">
                        <span class="field-error" th:errors="*{email}"></span>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input class="input" type="password" th:field="*{password}" placeholder="At least 8 characters">
                        <span class="field-error" th:errors="*{password}"></span>
                    </div>
                    <button type="submit" class="btn btn-yellow btn-block">Create account</button>
                </form>

                <p class="auth-foot">Already registered? <a th:href="@{/login}">Log in here</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
