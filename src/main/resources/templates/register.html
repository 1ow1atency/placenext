<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register · PlaceNext</title></head>
<body>
<h1>Student registration</h1>

<form th:action="@{/register}" th:object="${form}" method="post">
    <label>Full name <input type="text" th:field="*{fullName}"></label>
    <span th:errors="*{fullName}"></span><br>

    <label>Email <input type="email" th:field="*{email}"></label>
    <span th:errors="*{email}"></span><br>

    <label>Password <input type="password" th:field="*{password}"></label>
    <span th:errors="*{password}"></span><br>

    <button type="submit">Create account</button>
</form>

<p>Already registered? <a th:href="@{/login}">Log in</a></p>
</body>
</html>
