spring.application.name=placenext

spring.datasource.url=jdbc:mysql://localhost:3306/placenext
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server accepts up to 5 MB; the app itself enforces 2 MB for resumes (with a friendly message)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

placenext.upload-dir=uploads


