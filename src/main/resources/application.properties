spring.application.name=placenext

spring.datasource.url=jdbc:mysql://localhost:3306/placenext
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server accepts up to 5 MB; the app itself enforces 2 MB for resumes (with a friendly message)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

placenext.upload-dir=uploads

# ---------- Email (Step 17) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Set to false to only print emails in the console instead of sending them
placenext.mail.enabled=${MAIL_ENABLED:false}


